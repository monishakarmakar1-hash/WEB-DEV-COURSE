<!doctype html> <!-- Declares that this document uses HTML5. -->
<html lang="en"> <!-- Starts the HTML document and sets the language to English. -->
<head> <!-- Contains page settings and linked resources. -->
  <meta charset="UTF-8" /> <!-- Sets the character encoding to UTF-8. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Makes the page responsive. -->
  <title>Hello</title> <!-- Sets the browser tab title. -->
  <link rel="stylesheet" href="style.css" /> <!-- Connects the external CSS file. -->
</head> <!-- Ends the head section. -->
<body> <!-- Contains the visible page content. -->
  <h1>Hello, world!</h1> <!-- Displays the main heading. -->
  <p>This is my simple HTML page and i am exploring java script , css and html together .</p> <!-- Displays a paragraph. -->

  <button onclick="alert('You clicked the button!')"> <!-- Creates a button with a click alert. -->
    Click me <!-- Displays text inside the button. -->

    <script src="script.js"></script> <!-- Loads the external JavaScript file. -->
  </button> <!-- Ends the button element. -->
</body> <!-- Ends the visible page content. -->
</html> <!-- Ends the HTML document. -->
