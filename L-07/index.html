<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple webpage for experimentation">

    <title>Forms- Lets learn it </title>
</head>
<body>
    <h1> form to apply for a technical workshop.</h1>
<form action="post">
    <div> 
    </div> <!-- this is a block element: that starts a new line 
    and occupies the full width of its parent container -->

    <label for="username">
        Please Enter your username </label>
        <!--This is a label tag -->

    <input type="text" name="username"
     placeholder="Enter your username">  
     <!-- this is a input tag -->
<div>
    <input type="radio" id="male" name="gender" value="male">
     <label for="male">Male</label>
      <input type="radio" id="female" name="gender" value="female">
     <label for="female">Female</label>
</div>
     
<div>
    <input type="checkbox" id="Be a part of the workshop" name="participant" value="yes">
    <label for="Be a part of the workshop">I want to be a part of the workshop</label>
    <!-- this checkbox tag where we can select multiple options in a set-->
</div>
 <div>
    <label for="suggestions">Any suggestions for us?</label>
    <textarea name="suggestions"  rows="4" cols="50">Enter your suggestions...</textarea>
 </div>
<!-- this is textarea input type-->
 <div> 
    <select name="fruits">
        <option value="Apple">Apple</option>
        <option value="Banana">Banana</option>
        <option value="Orange">Orange</option>
    </select>
    <!-- this is a dropdown select element -->
 </div>
</form>
</body>
</html>
