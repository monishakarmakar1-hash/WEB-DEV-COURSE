<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and Block elements- HTML</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>HTML Inline and Block Elements</h1>
<p>This paragraph demonstrates a block-level element in HTML.</p>
     <!-- this is a paragraph tag which is a block element -->
     
     <a href="https://www.google.com" target="_blank">Visit Google</a>
     <!-- this is an anchor tag which is an inline element -->

     <div> I am a block element </div>
     <span> i am span and an inline element </span>

</body>
</html>
