 <!-- Quick Quiz:
    Without using br tag, write a vertically aligned form asking for name, city and pincode of a user.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link styleassignment01.css rel="stylesheet" href="styleassignment01.css">
    <img src="https://i.pinimg.com/originals/cd/2a/81/cd2a81105f4a72a8b39863c5e7e10ad5.jpg" alt="Web Development" width="500" height="300">
    <title> Form for attending Web Development classes</title>
</head>
<body>
    <a href="https://i.pinimg.com/originals/cd/2a/81/cd2a81105f4a72a8b39863c5e7e10ad5.jpg" target="_blank"></a>
    <h1> Form to attend Web Development classes for beginners</h1>
    <div>
        <p> Please fill the form below to attend the classes</p>
    <div><input type="text" name = "name" placeholder="Enter name"></div>
    <div><input type="text" name= "Email" placeholder="Enter your email"></div>
    <div><input type="text" name= "Enrollment Number" placeholder="Enter your enrollment number"></div>
    <div><input type="text" name= "City" placeholder="Enter your city"></div>
    <div><input type="text" name= "Pincode" placeholder="Enter your pincode"></div>
    

    
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>


    <div>
        <select name = "Branch" >
            <option value="CSE">CSE</option>
            <option value="CSE-AIML">CSE-AIML</option>
            <option value="CSE-DS">CSE-DS</option>
            <option value="IT">IT</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="MECH">MECH</option>

        </select>


        <select name ="Year" >
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
        </select>

    </div>
    <input type="checkbox" id="Will attend the classes and do the projects consistently" name = "participant" value="yes">
    <label for="Will attend the classes and do the projects consistently">I will attend the classes and do the projects consistently</label>

</body>
